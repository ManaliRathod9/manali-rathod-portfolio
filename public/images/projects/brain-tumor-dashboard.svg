<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" role="img" aria-label="Animated preview of the Brain Tumor Analytics Dashboard: a scan illustration, analytics tiles and a pulsing signal chart">
  <defs>
    <linearGradient id="bn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE8F1"/><stop offset="50%" stop-color="#F1EEFF"/><stop offset="100%" stop-color="#EAF2FF"/>
    </linearGradient>
    <radialGradient id="bn-scan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE1DC"/><stop offset="100%" stop-color="#FFF5F4"/>
    </radialGradient>
    <filter id="bn-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>
  <style>
    * { transform-box: fill-box; transform-origin: center; }
    .scanline { animation: bn-scan 6s ease-in-out infinite }
    @keyframes bn-scan { 0%, 100% { transform: translateY(-36px); opacity: .2 } 50% { transform: translateY(36px); opacity: .8 } }
    .lesion { animation: bn-pulse 3s ease-in-out infinite }
    @keyframes bn-pulse { 0%, 100% { opacity: .35; transform: scale(1) } 50% { opacity: .8; transform: scale(1.18) } }
    .sig { stroke-dasharray: 240; animation: bn-draw 9s ease-out infinite }
    @keyframes bn-draw { 0% { stroke-dashoffset: 240 } 40%, 100% { stroke-dashoffset: 0 } }
    .tile { animation: bn-tile 9s ease-out infinite }
    .t1 { animation-delay: .2s } .t2 { animation-delay: .6s } .t3 { animation-delay: 1s } .t4 { animation-delay: 1.4s }
    @keyframes bn-tile { 0% { opacity: .25 } 16%, 100% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) {
      .scanline, .lesion, .sig, .tile { animation: none; opacity: 1; transform: none; stroke-dashoffset: 0 }
    }
  </style>

  <rect width="400" height="250" fill="url(#bn-bg)"/>
  <g filter="url(#bn-sh)"><rect x="22" y="20" width="356" height="210" rx="14" fill="#FFFFFF"/></g>
  <rect x="22" y="20" width="356" height="30" rx="14" fill="#FFF6FA"/>
  <rect x="22" y="38" width="356" height="12" fill="#FFF6FA"/>
  <circle cx="40" cy="35" r="3.5" fill="#FF6B5E"/><circle cx="52" cy="35" r="3.5" fill="#FF9F43"/><circle cx="64" cy="35" r="3.5" fill="#14B8A6"/>
  <line x1="22" y1="50" x2="378" y2="50" stroke="#E2E8F0"/>

  <rect x="38" y="62" width="152" height="112" rx="12" fill="url(#bn-scan)" stroke="#FFC7C0"/>
  <g clip-path="none">
    <path d="M114 76c-14 0-24 8-26 18-11 3-17 11-17 21 0 8 5 15 12 19-2 11 6 21 19 21 5 7 13 12 22 12 11 0 20-6 24-14 13-1 23-10 23-22 0-5-2-10-5-13 3-4 5-9 5-14 0-12-10-21-23-21-5-4-12-7-19-7z"
      fill="#FFFFFF" fill-opacity=".65" stroke="#FF6B5E" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M120 84v72M120 102c-9 0-15 6-15 13M120 128c9 0 15 6 15 13" stroke="#FF9AA0" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle class="lesion" cx="142" cy="118" r="10" fill="#EC4899" opacity=".45"/>
    <circle cx="142" cy="118" r="4" fill="#EC4899"/>
    <rect class="scanline" x="38" y="70" width="152" height="3" fill="#3157F6" opacity=".3"/>
  </g>

  <g class="tile t1"><rect x="204" y="62" width="76" height="52" rx="10" fill="#EAF2FF"/><circle cx="228" cy="86" r="13" fill="#3157F6" opacity=".8"/><rect x="248" y="82" width="22" height="6" rx="3" fill="#93A9F5"/></g>
  <g class="tile t2"><rect x="288" y="62" width="74" height="52" rx="10" fill="#FFE8F1"/><circle cx="311" cy="86" r="10" fill="#EC4899" opacity=".8"/><rect x="329" y="82" width="22" height="6" rx="3" fill="#F9A8D4"/></g>
  <g class="tile t3"><rect x="204" y="122" width="76" height="52" rx="10" fill="#EAFBF5"/><circle cx="228" cy="146" r="11" fill="#14B8A6" opacity=".8"/><rect x="248" y="142" width="22" height="6" rx="3" fill="#7FD8C9"/></g>
  <g class="tile t4"><rect x="288" y="122" width="74" height="52" rx="10" fill="#FFF1E8"/><circle cx="311" cy="146" r="8" fill="#FF9F43" opacity=".85"/><rect x="329" y="142" width="22" height="6" rx="3" fill="#FFC188"/></g>

  <rect x="38" y="186" width="324" height="36" rx="10" fill="#FBFCFF" stroke="#E2E8F0"/>
  <polyline class="sig" points="54,206 84,206 96,192 110,220 124,198 138,206 176,206 190,194 204,218 218,206 258,206 272,196 286,214 300,206 346,206"
    fill="none" stroke="#3157F6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
